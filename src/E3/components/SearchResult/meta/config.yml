title:
    en: Search Result
    fr: Résultat de recherche
label:
    en: Search Result
    fr: Résultat de recherche
description:
    en: A component to display search results of experts in a list format, each with a card containing an image, title, details and a link to the expert's page.
    fr: Un composant pour afficher les résultats de recherche d'experts dans un format de liste, chacun avec une carte contenant une image, un titre, des détails et un lien vers la page de l'expert.

category: content
export: true

properties:
    scrollbar:
        label:
            en: Scrollbar Style
            fr: Style de barre de défilement
        type: string
        default: none
        enum:
            - label:
                  en: Hidden
                  fr: Masquée
              value: none
            - label:
                  en: Default
                  fr: Par défaut
              value: default
            - label:
                  en: Always Visible
                  fr: Toujours visible
              value: always
        description:
            en: Controls scrollbar visibility on the results list. Hidden hides the scrollbar while keeping scroll, Default uses the browser overlay scrollbar, Always Visible shows a persistent scrollbar when the list exceeds the viewport.
            fr: Contrôle la visibilité de la barre de défilement sur la liste des résultats.
